<section class="phead">
  <div class="wrap">
    <div class="sec-head rv" style="align-items:center">
      <div>
        <h1 class="h-page">Gallery</h1>
        <p class="lede">Visuals that speak.</p>
      </div>
      <div class="pills" data-filter-group data-filter-target="#galGrid">
        <button class="pill is-on" data-val="all">All</button>
        <button class="pill" data-val="photo">Photo</button>
        <button class="pill" data-val="digital">Digital</button>
        <button class="pill" data-val="painting">Painting</button>
        <button class="pill" data-val="3d">3D</button>
      </div>
    </div>
  </div>
</section>

<section class="sect-b">
  <div class="wrap">
    <div class="gal">

      <aside class="rv">
        <div class="gal-feat">
          <div class="ph" style="--h:206"><span class="ph-lb">Artwork</span></div>
        </div>
        <a href="#" class="btn btn-glass btn-block btn-sm">Submit Your Art</a>
      </aside>

      <!-- The mockup shows no titles or artist credits, so none are invented
           here. Each tile is labelled with the artwork it holds. -->
      <div class="gal-masonry" id="galGrid">
        <a href="#" class="gal-item rv" data-tags="photo" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-tags="digital" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-tags="painting" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-tags="3d" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-tags="photo" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-tags="digital" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-tags="painting" data-lbox>
          <div class="ph"><span class="ph-lb">Artwork</span></div>
          <div class="gal-ov"><div><b>Artwork title</b></div></div>
        </a>
      </div>

    </div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lbox" id="lightbox">
  <div class="lbox-in">
    <button class="x" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
    <div class="ph"><span class="ph-lb">Artwork</span></div>
    <div class="lbox-cap">
      <div>
        <b class="h-card" id="lboxTitle">Photo</b>
        <p class="tiny muted" id="lboxBy" style="margin-top:4px">&AElig; Gallery</p>
      </div>
      <button class="pill"><svg style="width:12px;height:12px;stroke-width:2" ><use href="#i-heart"/></svg></button>
    </div>
  </div>
</div>
