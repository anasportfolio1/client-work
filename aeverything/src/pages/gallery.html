<!--@desc: The Æ Gallery — photography, digital work, painting and 3D from the æverything community. Submit your own art.-->

<section class="phead">
  <div class="wrap">
    <div class="sec-head rv" style="align-items:center">
      <div>
        <h1 class="h-page">Gallery</h1>
        <p class="lede">Visuals that speak.</p>
      </div>
      <div class="pills" data-filter-group data-filter-target="#galGrid">
        <button class="pill is-on" data-val="all">All</button>
        <button class="pill" data-val="photo">Photo</button>
        <button class="pill" data-val="digital">Digital</button>
        <button class="pill" data-val="painting">Painting</button>
        <button class="pill" data-val="3d">3D</button>
      </div>
    </div>
  </div>
</section>

<section class="sect-b">
  <div class="wrap">
    <div class="gal">

      <aside class="rv">
        <div class="gal-feat">
          <div class="ph" style="--h:206"><span class="ph-lb">Featured work</span></div>
        </div>
        <a href="#" class="btn btn-glass btn-block btn-sm">Submit Your Art</a>
      </aside>

      <!-- The mockup shows no titles or artist credits, so none are invented
           here. Each tile is labelled with the artwork it holds. -->
      <div class="gal-masonry" id="galGrid">
        <a href="#" class="gal-item rv" data-lbox data-h="206" data-title="Photo" data-tags="photo">
          <div class="ph" style="aspect-ratio:1/1.16"><span class="ph-lb">Marble bust</span></div>
          <div class="gal-ov"><div><b>Photo</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-lbox data-h="196" data-title="Digital" data-tags="digital">
          <div class="ph" style="aspect-ratio:1/1.3;--h:196"><span class="ph-lb">Arched hall</span></div>
          <div class="gal-ov"><div><b>Digital</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-lbox data-h="20" data-title="Painting" data-tags="painting">
          <div class="ph" style="aspect-ratio:1/.8;--h:20"><span class="ph-lb">Mountain at dusk</span></div>
          <div class="gal-ov"><div><b>Painting</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-lbox data-h="338" data-title="Photo" data-tags="photo">
          <div class="ph" style="aspect-ratio:1/1.42;--h:338"><span class="ph-lb">Figure on rock</span></div>
          <div class="gal-ov"><div><b>Photo</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-lbox data-h="346" data-title="3D" data-tags="3d">
          <div class="ph" style="aspect-ratio:1/.72;--h:346"><span class="ph-lb">Rose marble</span></div>
          <div class="gal-ov"><div><b>3D</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-lbox data-h="200" data-title="Photo" data-tags="photo">
          <div class="ph" style="aspect-ratio:1/1.08;--h:200"><span class="ph-lb">Classical statue</span></div>
          <div class="gal-ov"><div><b>Photo</b></div></div>
        </a>
        <a href="#" class="gal-item rv" data-lbox data-h="226" data-title="Digital" data-tags="digital">
          <div class="ph" style="aspect-ratio:1/.9;--h:226"><span class="ph-lb">Moon over mountains</span></div>
          <div class="gal-ov"><div><b>Digital</b></div></div>
        </a>
      </div>

    </div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lbox" id="lightbox">
  <div class="lbox-in">
    <button class="x" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
    <div class="ph"><span class="ph-lb">Artwork</span></div>
    <div class="lbox-cap">
      <div>
        <b class="h-card" id="lboxTitle">Photo</b>
        <p class="tiny muted" id="lboxBy" style="margin-top:4px">&AElig; Gallery</p>
      </div>
      <button class="pill"><svg style="width:12px;height:12px;stroke-width:2" ><use href="#i-heart"/></svg></button>
    </div>
  </div>
</div>
